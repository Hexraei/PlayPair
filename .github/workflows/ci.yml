name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PlayPair.sln

      - name: Build
        run: dotnet build PlayPair.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlayPair.sln --configuration Release --no-build --verbosity normal

      - name: Dependency vulnerability scan
        run: |
          echo "Running vulnerable package check"
          vuln=$(dotnet list PlayPair.sln package --vulnerable)
          echo "$vuln"
          if echo "$vuln" | grep -q "No vulnerable packages were found."; then
            echo "No vulnerable packages detected"
          else
            echo "Vulnerabilities detected:" && echo "$vuln"
            exit 1
          fi

      - name: Quick static analysis (restore warnings)
        run: |
          echo "Running build with warnings as errors to catch static issues"
          dotnet build PlayPair.sln --configuration Release --no-restore
