name: Staging deploy and smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/PlayPair.Server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/playpair-server:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/playpair-server:staging-latest

  deploy-and-smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Pull image
        run: |
          docker pull ghcr.io/${{ env.OWNER_LC }}/playpair-server:staging-${{ github.sha }}

      - name: Run container
        run: |
          docker run -d --rm -p 8080:80 --name playpair-staging ghcr.io/${{ env.OWNER_LC }}/playpair-server:staging-${{ github.sha }}

      - name: Wait for /health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/health; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "Health check failed"; exit 1

      - name: Run server integration tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test tests/PlayPair.Server.Tests/PlayPair.Server.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: Stop container
        run: docker stop playpair-staging || true
